pid /tmp/drivemate-nginx.pid;
error_log /dev/stderr warn;
worker_processes auto;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    client_body_temp_path /tmp/drivemate-nginx/client;
    proxy_temp_path /tmp/drivemate-nginx/proxy;
    fastcgi_temp_path /tmp/drivemate-nginx/fastcgi;
    uwsgi_temp_path /tmp/drivemate-nginx/uwsgi;
    scgi_temp_path /tmp/drivemate-nginx/scgi;
    log_format drivemate_safe '$request_method $uri $status $body_bytes_sent';
    access_log /dev/stdout drivemate_safe;
    server_tokens off;
    server {
        listen 8080 default_server;
        server_name _;
        root /srv/drivemate-web/site;
        index index.html;
        client_max_body_size 6m;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        location = /api/v1/location/stream {
            proxy_pass http://127.0.0.1:18085;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_connect_timeout 5s;
            proxy_read_timeout 75s;
            proxy_send_timeout 75s;
            proxy_buffering off;
        }
        location /api/v1/ {
            proxy_pass http://127.0.0.1:18085;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 125s;
            proxy_send_timeout 125s;
            proxy_buffering off;
        }
        location ~ /\. { deny all; }
        location / { try_files $uri $uri/ /index.html; }
    }
}
