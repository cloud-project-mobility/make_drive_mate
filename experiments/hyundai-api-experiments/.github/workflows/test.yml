name: Offline tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON_INSTALL_DIR: ${{ github.workspace }}/.python-runtime
      UV_CACHE_DIR: ${{ github.workspace }}/.uv-cache
      UV_PYTHON_INSTALL_BIN: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.23'
          enable-cache: false
      - run: uv python install 3.11
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest
      - run: uv run python scripts/check_secrets.py
