apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: drivemate
resources:
  - namespace.yaml
  - service-account.yaml
  - deployment.yaml
  - service.yaml
configMapGenerator:
  - name: drivemate-runtime
    literals:
      - AWS_REGION=ap-southeast-2
      - DRIVEMATE_RELEASE_BUCKET=CONFIGURE_PRIVATE_BUCKET
      - DRIVEMATE_RELEASE_KEY=releases/CONFIGURE/release.zip
      - DRIVEMATE_RELEASE_SHA256=CONFIGURE_64_CHARACTER_SHA256
      - DRIVEMATE_RAG_POINTER_KEY=data/rag/pointers/CONFIGURE.json
      - DRIVEMATE_RAG_POINTER_SHA256=CONFIGURE_64_CHARACTER_SHA256
      - DRIVEMATE_DB_HOST=CONFIGURE_PRIVATE_RDS_HOST
      - DRIVEMATE_ANALYTICS_LATEST_KEY=data/cycles/latest.json
      - DRIVEMATE_ALLOW_LLM=true
      - DRIVEMATE_LLM_DAILY_LIMIT=20
