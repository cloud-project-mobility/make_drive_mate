spring.application.name=drivemate-api
server.port=${SERVER_PORT:18085}
server.address=${SERVER_ADDRESS:127.0.0.1}
server.forward-headers-strategy=none
server.error.include-message=never
server.error.include-stacktrace=never
server.tomcat.max-http-form-post-size=5246976
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/drivemate;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.connection-timeout=10000
spring.sql.init.mode=always
spring.jackson2.deserialization.fail-on-trailing-tokens=true
spring.jackson2.deserialization.fail-on-reading-dup-tree-key=true
spring.jackson2.parser.strict-duplicate-detection=true
spring.http.converters.preferred-json-mapper=jackson2
spring.mvc.log-request-details=false
