name: DriveMate CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  spring:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: sh backend-spring/mvnw -f pom.xml -B verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: spring-jar
          path: backend-spring/target/drivemate-api-0.2.0.jar
          retention-days: 7
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements-ml.txt
            backend/requirements-rag.txt
            infra/aws/requirements-aws.txt
      - run: python -m pip install -r backend/requirements-ml.txt -r backend/requirements-rag.txt -r infra/aws/requirements-aws.txt
      - run: python -m pip check
      - name: Key-free ML, extraction, RAG and AWS adapter tests
        run: |
          python -m unittest discover -s backend/scripts -p 'test_onbid*.py' -v
          python -m unittest discover -s backend/scripts -p 'test_document_rag.py' -v
          python -m unittest discover -s infra/aws -p 'test_*.py' -v
          python -m unittest discover -s infra/containers -p 'test_*.py' -v
  web:
    needs: spring
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      EXPO_NO_TELEMETRY: '1'
      EXPO_NO_DOTENV: '1'
      EXPO_PUBLIC_KAKAO_JAVASCRIPT_KEY: ${{ vars.EXPO_PUBLIC_KAKAO_JAVASCRIPT_KEY }}
      CI: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: spring-jar
          path: backend-spring/target
      - run: npm ci
      - run: npm run check
      - run: npx expo install --check
      - run: npx playwright install --with-deps chromium
      - run: npm run export:web
      - name: Verify the exported web artifact with the isolated Spring API
        env:
          DRIVEMATE_WEB_STATIC: '1'
        run: npm run test:integrated -- tests/e2e/valuation.spec.ts tests/e2e/onbid.spec.ts tests/e2e/backend.spec.ts tests/e2e/live-location.spec.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-dist
          path: dist/
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: browser-failure-report
          path: playwright-report/
          retention-days: 3
  release:
    needs: [spring, python, web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: spring-jar
          path: backend-spring/target
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: web-dist
          path: dist
      - name: Package code only without credentials or private model data
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: python infra/aws/deploy_release.py package --revision "$SOURCE_REVISION" --output release-artifacts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: code-release-${{ github.sha }}
          path: release-artifacts/
          retention-days: 14
