name: Deploy reviewed DriveMate ECS release
on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful DriveMate CI run ID for a main push
        required: true
        type: string
permissions:
  contents: read
  actions: read
  id-token: write
concurrency:
  group: drivemate-production-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_SERVICE: ${{ vars.ECS_SERVICE }}
      ECS_API_TASK_FAMILY: ${{ vars.ECS_API_TASK_FAMILY }}
    steps:
      - name: Verify the trusted successful main CI run
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        id: verified
        env:
          CI_RUN_ID: ${{ inputs.ci_run_id }}
        with:
          script: |
            const raw = process.env.CI_RUN_ID;
            if (!/^[0-9]{1,18}$/.test(raw)) throw new Error('Invalid run ID');
            const {data: run} = await github.rest.actions.getWorkflowRun({...context.repo, run_id: Number(raw)});
            if (run.conclusion !== 'success' || run.status !== 'completed' || run.event !== 'push' ||
                run.head_branch !== 'main' || run.head_repository.full_name !== context.repo.owner + '/' + context.repo.repo ||
                run.path !== '.github/workflows/ci.yml' || !/^[a-f0-9]{40}$/.test(run.head_sha)) {
              throw new Error('Only a successful main push from this CI workflow can deploy');
            }
            core.setOutput('revision', run.head_sha);
            core.setOutput('run_id', String(run.id));
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.verified.outputs.revision }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: code-release-${{ steps.verified.outputs.revision }}
          path: release-artifacts
          run-id: ${{ steps.verified.outputs.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r infra/aws/requirements-aws.txt
      - name: Check release identity before requesting AWS credentials
        env:
          SOURCE_REVISION: ${{ steps.verified.outputs.revision }}
        run: |
          test "$(cat release-artifacts/source-revision.txt)" = "$SOURCE_REVISION"
          python infra/aws/deploy_release.py inspect --archive release-artifacts/code-release.zip --revision "$SOURCE_REVISION" --sha256 "$(cat release-artifacts/code-release.sha256)"
          python infra/aws/deploy_ecs.py stage --repo . --archive release-artifacts/code-release.zip --revision "$SOURCE_REVISION" --sha256 "$(cat release-artifacts/code-release.sha256)"
          python infra/containers/prepare_context.py --repo . --output container-context
      - uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: drivemate-${{ github.run_id }}
          role-duration-seconds: 3600
      - name: Build or reuse the immutable source image in ECR
        env:
          SOURCE_REVISION: ${{ steps.verified.outputs.revision }}
        run: python infra/aws/deploy_ecs.py image --context container-context --revision "$SOURCE_REVISION" --output release-artifacts/image.json
      - name: Refresh short-lived credentials for rollout and possible rollback
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: drivemate-deploy-${{ github.run_id }}
          role-duration-seconds: 3600
      - name: Deploy the API task and verify the expected revision
        env:
          SOURCE_REVISION: ${{ steps.verified.outputs.revision }}
        run: python infra/aws/deploy_ecs.py deploy --image-file release-artifacts/image.json --revision "$SOURCE_REVISION" --report release-artifacts/ecs-deployment.json
      - name: Save bounded deployment evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ecs-deployment-${{ github.run_id }}
          path: |
            release-artifacts/image.json
            release-artifacts/ecs-deployment.json
          if-no-files-found: ignore
          retention-days: 30
