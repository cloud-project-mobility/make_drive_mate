[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "hyundai-api-experiments"
version = "0.1.0"
description = "DriveMate Hyundai official Sample API experiments with offline verification"
requires-python = ">=3.11,<3.12"
dependencies = ["httpx>=0.28.1,<0.29", "python-dotenv>=1.1,<2"]

[project.scripts]
hyundai-experiments = "hyundai_experiments.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<9", "ruff>=0.14,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/hyundai_experiments"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".python-runtime", ".uv-cache", ".venv", "output"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.uv]
cache-dir = ".uv-cache"
python-preference = "managed"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
